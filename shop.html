<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — ShoppingOye</title>
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="logo" href="index.html"><img src="assets/logo.svg" alt="ShoppingOye"></a>
  <nav class="main">
    <a href="index.html">Home</a>
    <a class="cta" href="submit.html">List Your Shop</a>
    <a href="dispute.html">Complaint</a>
    <a href="rules.html">Rules</a>
  </nav>
</div></header>
<div class="wrap">
  <div class="demo"><b>Demo version:</b> this is a sample listing. Real shops will show their live WhatsApp order button here.</div>
  <div id="shop-box"></div>
</div>
<footer class="site"><div class="wrap">
  If this shop does not deliver or sends the wrong item, file a complaint within 7 days and the bond covers your refund.
</div></footer>
<script src="assets/supabase.js"></script>
<script src="assets/data.js"></script>
<script>
function render(){
const id = param("id");
const s = SHOPS.find(x => x.id === id);
if(!s){
  document.getElementById("shop-box").innerHTML = "<h2>Shop not found</h2><p>Go back to the <a href='index.html'>homepage</a> and pick a board.</p>";
} else {
  const cat = catBySlug(s.cat);
  const rank = rankedShops(s.cat).findIndex(x => x.id === s.id) + 1;
  const waDigits = (s.whatsapp || "").replace(/[^0-9]/g, "");
  const waLink = (text) => "https://wa.me/" + waDigits + "?text=" + encodeURIComponent(text);
  const prods = productsForShop(s.id);
  const topTotal = rankedShops(s.cat)[0].boost;
  const need = topTotal + 1000 - s.boost;
  const prodHtml = prods.length ? `<div class="grid">${prods.map(p => `
    <div class="pcard">
      <div class="pimg">📦${p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.remove()">` : ""}</div>
      <h3>${p.name}</h3>
      <p>${p.tag}</p>
      <div class="price">${money(p.price)}</div>
      ${waDigits ? `<div class="actions"><a class="btn wa" href="${waLink("Hi, I want to order " + p.name + " (" + money(p.price) + ") from " + s.name + ".")}">Order this</a></div>` : `<p style="font-size:13px">Order ke liye shop ka WhatsApp jald aa raha hai.</p>`}
    </div>`).join("")}</div>`
    : "<p>No products listed yet.</p>";
  document.title = s.name + " — ShoppingOye";
  document.getElementById("shop-box").innerHTML = `
    <div class="shop-hero">
      <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>
      <div>
        <h2>${s.name} ${s.bondVerified ? `<span class="badge">✓ Bond Protected</span>` : `<span class="badge muted">Bond verification pending</span>`}</h2>
        <p>${[cat.name, s.tag, s.city, s.handle].filter(x => x).join(" · ")}</p>
        <p>${s.desc}</p>
      </div>
    </div>
    <div class="counters">
      <div class="stat"><b>#${rank}</b><span>Rank in ${cat.name}</span></div>
      <div class="stat"><b>${money(s.bond)}</b><span>Trust bond (refundable)</span></div>
      <div class="stat"><b>${money(s.boost)}</b><span>Total boost paid</span></div>
      <div class="stat"><b>${s.orders}</b><span>Orders served</span></div>
    </div>
    ${waDigits ? `<p><a class="btn wa" href="${waLink("Hi " + s.name + ", I want to order from ShoppingOye.")}">Order on WhatsApp</a></p>` : ""}
    ${rank > 1 ? `<p class="climb">${s.boost > 0 ? `Top position ke liye total ${money(topTotal + 1000)} chahiye. Is shop ne pehle ${money(s.boost)} boost diya hua hai, jo count hoga, is liye sirf ${money(need)} ka farq dena hoga.` : `Top position claim karne ke liye ${money(topTotal + 1000)} chahiye (pehli dafa poori raqam).`}</p>` : `<p class="climb">🏆 Ye shop is board par #1 par hai.</p>`}
    <h3>Products (${prods.length})</h3>
    ${prodHtml}
    <p style="margin-top:20px"><a class="btn" href="dispute.html?shop=${s.id}">File a complaint about this shop</a>
       <a class="btn ghost" href="board.html?cat=${s.cat}">Back to ${cat.name} board</a>
       <a class="btn ghost" href="manage.html?shop=${s.id}">Manage this shop</a></p>
    ${waDigits ? "" : `<p style="color:var(--muted);font-size:14px">Demo listing: WhatsApp ordering activates when the real shop joins with a verified bond.</p>`}`;
}
}
render();
loadLiveShops().then(render);
</script>
</body>
</html>
